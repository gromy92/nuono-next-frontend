name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System delivery contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_delivery_contract.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source-size policy self-test
        run: node --test scripts/source_size_policy.test.mjs

      - name: Enforce source-file size
        env:
          SOURCE_SIZE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check_source_size.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Set up pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Product baseline display contract
        run: pnpm product-baseline:display-contract

      - name: Source contract tests
        run: pnpm contract:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Release artifact contract tests
        run: node --test scripts/package_release_artifact.test.mjs

      - name: Build
        env:
          NUONO_NEXT_PUBLIC_BASE_PATH: /ai/
        run: pnpm build

      - name: Prepare master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RELEASE_ARTIFACT_NAME: nuono-next-frontend-${{ github.sha }}
        run: >-
          node scripts/package_release_artifact.mjs
          --dist dist
          --output "$RUNNER_TEMP/frontend-release-artifact"

      - name: Upload master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: nuono-next-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-release-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
